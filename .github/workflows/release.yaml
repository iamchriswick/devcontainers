name: "TEST: Release Dev Container Features to Github & Generate Documentation"
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/features' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: "Validate Features & Generate Documentation"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
          
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create releases for Features
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          npm install -g @devcontainers/cli
          out="$RUNNER_TEMP/features-output"
          devcontainer features package ./src --output-folder "$out" --force-clean-output-folder
          jq -r '.features[] | "\(.id) \(.version)"' "$out/devcontainer-collection.json" | while read -r id version; do
              tag="feature_${id}_${version}"
              if gh release view "$tag" > /dev/null 2>&1; then
                  echo "Release $tag already exists. Skipping."
                  continue
              fi
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
                  git fetch origin "refs/tags/$tag:refs/tags/$tag"
              else
                  git tag "$tag" "$GITHUB_SHA"
                  git push origin "refs/tags/$tag"
              fi
              gh release create "$tag" "$out/devcontainer-feature-$id.tgz" --verify-tag --title "$tag" --notes-from-tag
          done

      - name: Create PR for Documentation
        id: push_image_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Start."
          # Configure git and Push updates
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git config --global user.name github-actions[bot]
          git config pull.rebase false
          branch=automated-documentation-update-$GITHUB_RUN_ID
          git checkout -b $branch
          message='Automated documentation update'
          # Add / update and commit
          git add */**/README.md
          git commit -m 'Automated documentation update [skip ci]' || export NO_UPDATES=true
          # Push
          if [ "$NO_UPDATES" != "true" ] ; then
              git push origin "$branch"
              gh pr create --title "$message" --body "$message" --base features
          fi
