name: "Package and Publish Dev Container Features"
on:
  workflow_dispatch:
    
  push:
    branches:
      - main
    paths:
      - features # Only runs when the features submodule pointer updates

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: "Publish Feature"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          oci-registry: ghcr.io
          features-namespace: iamchriswick/devcontainers/features
          base-path-to-features: ./features/src
          generate-docs: "true"

      - name: Create PR for Documentation
        id: push_image_info
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_PAT }}
        run: |
          set -e
          cd features

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          branch=automated-documentation-update-$GITHUB_RUN_ID
          git checkout -b "$branch"
          message='Automated documentation update'

          git add src/**/README.md
          git commit -m "$message [skip ci]" || export NO_UPDATES=true

          if [ "$NO_UPDATES" != "true" ]; then
              # Remove checkout's persisted authorization header, if present.
              git config --local --unset-all http.https://github.com/.extraheader || true

              # Use the PAT for the Git push. GH_TOKEN must be set in this step's env.
              git config --local credential.helper \
                '!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'

              git push origin "$branch"
              gh pr create --title "$message" --body "$message" --base main
          fi
          