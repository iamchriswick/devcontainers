name: "Package and Publish Dev Container Features"
on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - features # Only runs when the features submodule pointer updates

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.MAIN_REPO_PAT }}
          persist-credentials: true

      - name: "Publish Feature"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          oci-registry: ghcr.io
          features-namespace: iamchriswick/devcontainers/features
          base-path-to-features: ./features/src
          generate-docs: "true"

      - name: Create PR for Documentation
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_PAT }}
        run: |
          set -e
          cd features

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          branch="automated-documentation-update-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          message='Automated documentation update'

          git add src/**/README.md
          if ! git diff --cached --quiet; then
            git commit -m "$message [skip ci]"
            git push origin "$branch"

            gh pr create \
              --repo iamchriswick/devcontainer-features \
              --title "$message" \
              --body "$message" \
              --base main
          else
            echo "No documentation changes to commit."
          fi