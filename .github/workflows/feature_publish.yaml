name: "Package and Publish Dev Container Features"
on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - features # Only runs when the features submodule pointer updates

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.MAIN_REPO_PAT }}

      - name: "Publish Feature"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          oci-registry: ghcr.io
          features-namespace: iamchriswick/devcontainers/features
          base-path-to-features: ./features/src
          generate-docs: "true"

      - name: Create PR for Documentation
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_PAT }}
        run: |
          set -e
          echo "Start."

          # Configure git
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git config --global user.name github-actions[bot]
          git config pull.rebase false
          branch=automated-documentation-update-$GITHUB_RUN_ID
          message='Automated documentation update'

          # Check out the documentation branch
          git checkout -b $branch

          # Integrate the remote changes before pushing
          git pull origin $branch

          # Add / update and commit
          git add */**/README.md
          git commit -m 'Automated documentation update [skip ci]' || export NO_UPDATES=true

          # Push updates
          if [ "$NO_UPDATES" != "true" ] ; then
              git push origin "$branch"
              gh pr create --title "$message" --body "$message" --base features
          fi
