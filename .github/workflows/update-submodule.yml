name: Update Submodules

on:
  repository_dispatch:
    types: [submodule-updated]

# Prevents parallel pushes from colliding if two submodules update at once
concurrency:
  group: submodule-update
  cancel-in-progress: false

jobs:
  updateSubmodule:
    name: Update ${{ github.event.client_payload.submodule }} Submodule
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Optional: Uncomment the line below and add the PAT to your main repo secrets
          # if you want this commit to trigger your other CI/CD workflows:
          token: ${{ secrets.MAIN_REPO_PAT }}

      - name: Pull latest changes in ${{ github.event.client_payload.submodule }}
        run: |
          SUBMODULE="${{ github.event.client_payload.submodule }}"
          git submodule update --remote "$SUBMODULE"
          git status

      - name: Commit and push updated submodule pointer
        id: submodule_commit_step
        run: |
          SUBMODULE="${{ github.event.client_payload.submodule }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$SUBMODULE"
          git diff --staged --quiet || (git commit -m "chore: update $SUBMODULE submodule" && git push)

      - name: Trigger release workflow
        uses: peter-evans/repository-dispatch@v4
        with:
            token: ${{ secrets.MAIN_REPO_PAT }}
            repository: iamchriswick/devcontainers
            event-type: submodule-pointer-commited
            client-payload: '{"submodule": "${{ github.event.client_payload.submodule }}", "pointer_status": "${{ steps.submodule_commit_step.outcome }}"}'
